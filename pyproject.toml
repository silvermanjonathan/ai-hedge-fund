[tool.poetry]
name = "aihf"
version = "2.2.0"
description = "An AI-powered hedge fund: LLM investor agents and quant alpha models you can build, backtest, and run from your terminal"
authors = ["Virat Singh <virat.dot@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/virattt/ai-hedge-fund"
repository = "https://github.com/virattt/ai-hedge-fund"
keywords = ["ai", "hedge-fund", "trading", "llm", "backtesting", "agents"]
packages = [
    { include = "hedge_fund", from = "." }
]
exclude = [
    "hedge_fund/**/test_*.py",
    "hedge_fund/conftest.py",
    # Dev-only: the golden prompt fixture and the script that regenerates it.
    # regolden imports from test_snapshot.py, which is excluded above, so
    # shipping it would install a module that cannot run.
    "hedge_fund/**/*_golden.txt",
    "hedge_fund/features/regolden.py",
]

[tool.poetry.dependencies]
python = "^3.11"
langchain-anthropic = "0.3.5"
# Direct: Anthropic models use the SDK (hedge_fund/llm/anthropic_client.py).
# 0.120.2 is the floor that has output_config (effort + json_schema format),
# adaptive thinking, and the "refusal" stop reason; <1 is what
# langchain-anthropic 0.3.5 allows.
anthropic = ">=0.120.2,<1"
langchain-openai = "^0.3.5"
langchain-deepseek = "^0.1.2"
langchain-google-genai = "^2.0.11"
langchain-xai = "^0.2.5"
pandas = "^2.1.0"
numpy = "^1.24.0"
python-dotenv = "1.0.0"
matplotlib = "^3.9.2"
requests = "^2.32.0"
rich = "^14.2.0"
pydantic = "^2.4.2"
scipy = "^1.11.0"
pyyaml = "^6.0.3"
textual = "^8.2.8"
# Free price source for HEDGE_FUND_DATA=free (hedge_fund/data/prices.py).
# Yahoo data is for personal/educational use.
yfinance = ">=1.7,<2"

[tool.poetry.scripts]
aihf = "hedge_fund.run:main"
aihf-universe = "hedge_fund.universe.__main__:main"
aihf-ledger = "hedge_fund.ledger.__main__:main"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
# See .flake8 for why 120 (was 420, inherited from the deleted pre-2.0 tree).
line-length = 120
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
force_alphabetical_sort_within_sections = true
